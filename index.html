<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RESONANT — PALIS OFF · Interactive 3D Configurator (Demo)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 20%, #2a2f38 0%, #17191e 55%, #0e1013 100%);
    color: #e8e9eb;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  header {
    position: absolute; top: 0; left: 0; right: 0; padding: 18px 20px 0;
    pointer-events: none; z-index: 5;
  }
  header h1 { font-size: 22px; letter-spacing: .35em; font-weight: 700; }
  header h1 span { color: #e07840; }
  header p { margin-top: 4px; font-size: 12.5px; color: #a7adb8; letter-spacing: .08em; }
  #hint {
    position: absolute; top: 74px; left: 20px; font-size: 12px; color: #7d838e; z-index: 5;
    pointer-events: none;
  }
  #panel {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 5;
    width: min(94vw, 640px);
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    appearance: none; border: 1px solid #3a3f47; background: rgba(20, 22, 26, .82);
    color: #e8e9eb; font: 600 13px/1 inherit; padding: 10px 14px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  button:hover { border-color: #e07840; }
  button.active { background: #e07840; border-color: #e07840; color: #141414; }
  button.view { padding: 8px 12px; font-weight: 500; color: #c6cbd4; }
  #handleInfo { font-size: 12.5px; color: #a7adb8; text-align: center; min-height: 1.2em; }
  #loading, #error {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; z-index: 10; background: rgba(14, 16, 19, .86);
    font-size: 14px; color: #c6cbd4; text-align: center; padding: 20px;
  }
  #error { display: none; color: #ff9a8a; }
  #debug {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-height: 34vh; overflow-y: auto; padding: 8px 10px;
    background: rgba(0, 0, 0, .88); color: #9be28a;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
    pointer-events: none;
  }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #3a3f47; border-top-color: #e07840;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    header h1 { font-size: 18px; }
    #hint { display: none; }
  }
</style>
<script>
// Diagnostic harness (temporary): records stage log + any window error, and
// shows it in #debug so a stuck load can be read from a screenshot.
window.__vlog = [];
window.__vlogAdd = function (msg) {
  window.__vlog.push(msg);
  var d = document.getElementById('debug');
  if (d) d.textContent = window.__vlog.join('\n');
};
window.__vlogShow = function () {
  var d = document.getElementById('debug');
  if (d) d.style.display = 'block';
};
window.addEventListener('error', function (e) {
  window.__vlogAdd('WINDOW ERROR: ' + (e.message || e.type) + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
  window.__vlogShow();
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  window.__vlogAdd('UNHANDLED REJECTION: ' + (r && r.message ? r.message : r));
  window.__vlogShow();
});
if (new URLSearchParams(window.location.search).get('debug') === '1') {
  window.addEventListener('DOMContentLoaded', function () { window.__vlogShow(); });
}
setTimeout(function () {
  if (!window.__viewerReady) {
    window.__vlogAdd('WATCHDOG: viewer not ready after 8s');
    window.__vlogShow();
  }
}, 8000);
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<header>
  <h1>RESONANT <span>·</span> PALIS OFF</h1>
  <p>Interactive 3D Table Tennis Blade Configurator — competition demo · Serial S02025148</p>
</header>
<div id="hint">Drag to rotate · Scroll or pinch to zoom · Right-drag to pan</div>
<div id="panel">
  <div id="handleInfo"></div>
  <div class="row" id="handles">
    <button data-handle="1" class="active">Handle 1 — Black wood · PALIS / OFF</button>
    <button data-handle="2">Handle 2 — Padauk · three light stripes</button>
  </div>
  <div class="row" id="views">
    <button class="view" data-view="front">Front</button>
    <button class="view" data-view="back">Back</button>
    <button class="view" data-view="edge">Blade edge</button>
    <button class="view" data-view="handle">Handle</button>
    <button class="view" data-view="butt">Handle butt</button>
  </div>
</div>
<div id="loading"><div class="spin"></div><div>Loading the blade…</div></div>
<div id="error"><div id="errorText">Could not load the 3D model.</div></div>
<div id="debug"></div>

<script>
// Dynamic import on purpose: a static <script type="module"> hides its load
// failure (no window error fires), while import() rejects with the exact error.
import('./viewer.js').catch(function (e) {
  var m = 'MODULE LOAD FAILED: ' + (e && e.message ? e.message : e);
  if (window.__vlogAdd) window.__vlogAdd(m);
  if (window.__vlogShow) window.__vlogShow();
  var le = document.getElementById('loading'); if (le) le.style.display = 'none';
  var ee = document.getElementById('error'); if (ee) ee.style.display = 'flex';
  var et = document.getElementById('errorText'); if (et) et.textContent = m;
});
</script>
</body>
</html>
